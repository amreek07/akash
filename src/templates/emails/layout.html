<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background:#f5f7fb; font-family:Arial,Helvetica,sans-serif; color:#555f69;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
    {{preheader}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb; padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e4e8ef;">
          <tr>
            <td style="background:#070b16; padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="48" valign="middle">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td align="center" valign="middle" width="48" height="48" style="background:#1c4dfb; border-radius:12px; color:#ffffff; font-size:18px; font-weight:bold;">
                          CH
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td valign="middle" style="padding-left:14px;">
                    <p style="margin:0; color:#ffffff; font-size:18px; font-weight:bold; letter-spacing:0.2px;">Coding Hubs</p>
                    <p style="margin:4px 0 0; color:#f9bd01; font-size:11px; font-weight:bold; letter-spacing:0.28em;">INSTITUTE</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="height:4px; background:#f9bd01; font-size:0; line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:36px 32px 28px;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="background:#f5f7fb; border-top:1px solid #e4e8ef; padding:22px 32px; text-align:center;">
              <p style="margin:0 0 8px; color:#555f69; font-size:12px; line-height:1.6;">
                {{footerNote}}
              </p>
              <p style="margin:0; color:#555f69; font-size:12px; line-height:1.6;">
                {{phone}} &nbsp;|&nbsp; {{supportEmail}}
              </p>
              <p style="margin:10px 0 0; color:#8a94a0; font-size:11px;">
                &copy; {{year}} Coding Hubs Institute. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
